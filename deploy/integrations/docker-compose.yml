# Optional local stack for integration testing (Huginn).
# Quick start: docs/INTEGRATIONS_LOCAL.md
#
#   npm run integrations:huginn:up
#   npm run integrations:huginn:scenario   # import generated JSON in Huginn UI
#
# Huginn POST agent target (from host):
#   http://host.docker.internal:3000/api/admin/integrations/ingest
# Production on VPS:
#   https://<your-site>/api/admin/integrations/ingest
#   Authorization: Bearer $INTEGRATIONS_INGEST_SECRET

services:
  huginn:
    image: huginn/huginn:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: huginn-db
      DATABASE_PORT: 5432
      DATABASE_NAME: huginn
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: huginn
      INVITATION_CODE: stackwise-local
      FORCE_SSL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - huginn-db

  huginn-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: huginn
      POSTGRES_DB: huginn
    volumes:
      - huginn_pg:/var/lib/postgresql/data

volumes:
  huginn_pg:
